name: Install GitButler
description: >
  Installs the GitButler version clonager is tested against, and puts its
  `but` CLI on the PATH. On macOS (Apple silicon) that's the app, with `but`
  linked to it as Homebrew does (Homebrew itself only installs the latest
  version). On Linux (x86-64) it's the standalone `but` binary GitButler
  publishes with each release.

runs:
  using: composite
  steps:
    - shell: bash
      env:
        # "<version>-<build>". The macOS URL format and checksum come from
        # Homebrew's gitbutler cask (Casks/g/gitbutler.rb), and the Linux
        # `but` is in the same release folder. update-gitbutler.yml bumps
        # all three.
        GITBUTLER_VERSION: 0.23.5-3373
        GITBUTLER_MACOS_SHA256: 783a91ef5da43e28fab6b672bf9e65d0d49e9671489daaac9646c5429d9122f4
        GITBUTLER_LINUX_SHA256: 5e4c746201121eec3bede41e6540d66f341e3e6d05c7ba0874435dfd7a42224a
      run: |
        release="https://releases.gitbutler.com/releases/release/$GITBUTLER_VERSION"
        mkdir -p "$RUNNER_TEMP/bin"
        case "$RUNNER_OS/$RUNNER_ARCH" in
          macOS/ARM64)
            archive="$RUNNER_TEMP/GitButler.app.tar.gz"
            curl -fsSL -o "$archive" "$release/macos/aarch64/GitButler.app.tar.gz"
            echo "$GITBUTLER_MACOS_SHA256  $archive" | shasum -a 256 -c
            tar -xzf "$archive" -C "$RUNNER_TEMP"
            ln -s "$RUNNER_TEMP/GitButler.app/Contents/MacOS/gitbutler-tauri" "$RUNNER_TEMP/bin/but"
            ;;
          Linux/X64)
            download="$RUNNER_TEMP/but"
            curl -fsSL -o "$download" "$release/linux/x86_64/but"
            echo "$GITBUTLER_LINUX_SHA256  $download" | sha256sum -c
            install -m 755 "$download" "$RUNNER_TEMP/bin/but"
            ;;
          *)
            echo "::error::No GitButler install for $RUNNER_OS/$RUNNER_ARCH runners"
            exit 1
            ;;
        esac
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/bin/but" --version
