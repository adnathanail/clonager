name: 🧪 CI

on:
  push:
    branches: [main]
  pull_request:
  # Started by dependabot-vendor-hash.yml, update-flake-lock.yml and
  # update-gitbutler.yml, whose pushes don't trigger pull_request.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        # macOS is where clonager runs; Linux keeps it portable.
        os: [macos-latest, ubuntu-latest]
        # "min" is the version in go.mod, so raising it there is caught here.
        go: [min, stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go == 'stable' && 'stable' || '' }}
          go-version-file: ${{ matrix.go == 'min' && 'go.mod' || '' }}
      - uses: extractions/setup-just@v4

      # For the tests that run `but`. They skip without it, except where
      # CLONAGER_TEST_BUT is set.
      - uses: ./.github/actions/install-gitbutler

      # For the tests that run `cg shell-init`'s output in each shell
      # it supports (bash is on both runners already, and zsh on macOS).
      # They skip a shell that isn't installed, except where
      # CLONAGER_TEST_SHELLS is set.
      - name: Install fish and zsh
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install fish
          else
            sudo apt-get update
            sudo apt-get install -y fish zsh
          fi

      # The tests build throwaway git repos, so they need git (on both runners).
      - name: Test
        env:
          CLONAGER_TEST_BUT: '1'
          CLONAGER_TEST_SHELLS: '1'
        run: just test -race

      - name: Build static binary
        run: CGO_ENABLED=0 just build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@v4

      - name: gofmt
        run: just fmt-check

      - name: go mod tidy
        run: just tidy-check

      - name: go vet
        run: just vet

      # just golangci runs it from nixpkgs; the action pins the version and
      # adds annotations and a cache.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  nix:
    name: Nix build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: extractions/setup-just@v4
      # Builds the flake package (running the tests again inside the Nix
      # build), so a stale vendorHash is caught here rather than in nix-darwin.
      - name: nix build
        run: just nix -L
