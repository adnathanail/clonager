name: Release

# Run by hand: Actions > Release > Run workflow, choosing patch, minor or
# major. The new version is the latest release tag (vX.Y.Z) bumped by that.
#
# Nix builds can't see git tags, so the version has to be in the source. This
# makes a release commit on top of main that adds a VERSION file, tags it, and
# pushes only the tag: main itself never has VERSION, so builds from main are
# named by commit, and builds from the tag by its version. (The release commit
# is reachable from the tag, but isn't on main.)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to bump"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write # push the tag and create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check this is main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Releases are made from main, not $REF"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true # release tags aren't on main, so fetch them all

      - name: Work out the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          IFS=. read -r major minor patch <<< "${latest:-v0.0.0}"
          major=${major#v}
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "::error::Unknown bump $BUMP"; exit 1 ;;
          esac
          version="v$major.$minor.$patch"
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "::error::$version is already tagged"
            exit 1
          fi
          echo "Releasing $version (previous release: ${latest:-none})"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "previous=$latest" >> "$GITHUB_OUTPUT"

      - name: Make the release commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "$VERSION" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "Release $VERSION"
          git tag -a "$VERSION" -m "Release $VERSION"

      # Build what's about to be released (running the tests), and check it
      # reports the right version, before anything is pushed.
      - uses: cachix/install-nix-action@v31
      - name: Build and check the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          nix build -L
          got=$(./result/bin/clonager --version | tail -n 1)
          if [ "$got" != "version $VERSION" ]; then
            echo "::error::The build says '$got', expected 'version $VERSION'"
            exit 1
          fi

      - name: Push the tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: git push origin "refs/tags/$VERSION"

      - name: Create the GitHub release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          GH_TOKEN: ${{ github.token }}
        # Release commits aren't on main, so the previous release's tag isn't
        # an ancestor of this one, and GitHub would otherwise skip back to the
        # last tag that is. Tell it where the notes start.
        run: |
          gh release create "$VERSION" --verify-tag --generate-notes --title "$VERSION" \
            ${PREVIOUS:+--notes-start-tag "$PREVIOUS"}
