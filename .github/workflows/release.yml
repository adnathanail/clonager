name: Release

# Run by hand: Actions > Release > Run workflow, with a version like v0.2.0.
#
# Nix builds can't see git tags, so the version has to be in the source. This
# makes a release commit on top of main that adds a VERSION file, tags it, and
# pushes only the tag: main itself never has VERSION, so builds from main are
# named by commit, and builds from the tag by its version. (The release commit
# is reachable from the tag, but isn't on main.)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.2.0"
        required: true

permissions:
  contents: write # push the tag and create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Releases are made from main, not $REF"
            exit 1
          fi
          if ! echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::$VERSION isn't a version like v0.2.0 (or v0.2.0-rc.1)"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # for the existing tags

      - name: Check the tag is new
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::$VERSION is already tagged"
            exit 1
          fi

      - name: Make the release commit
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "$VERSION" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "Release $VERSION"
          git tag -a "$VERSION" -m "Release $VERSION"

      # Build what's about to be released (running the tests), and check it
      # reports the right version, before anything is pushed.
      - uses: cachix/install-nix-action@v31
      - name: Build and check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          nix build -L
          got=$(./result/bin/clonager --version | tail -n 1)
          if [ "$got" != "version $VERSION" ]; then
            echo "::error::The build says '$got', expected 'version $VERSION'"
            exit 1
          fi

      - name: Push the tag
        env:
          VERSION: ${{ inputs.version }}
        run: git push origin "refs/tags/$VERSION"

      - name: Create the GitHub release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" --verify-tag --generate-notes --title "$VERSION"
